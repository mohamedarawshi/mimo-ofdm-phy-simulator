[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-ofdm-phy-simulator"
version = "1.0.0"
description = "Educational pilot-assisted 2x2 MIMO-OFDM link simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]
